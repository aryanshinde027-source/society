
services:
  db:
    image: mysql:8.0
    container_name: society-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: society_management

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: society-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://db:3306/society_management
      DB_USERNAME: root
      DB_PASSWORD: root
      GEMINI_API_KEY: "${GEMINI_API_KEY}"

    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
